# PGSR 本地学习工作区的模型分工。
# 主线程负责顶层规划、研究设计和最终审计；用户在当前会话中的显式模型选择仍可覆盖本文件。
model = "gpt-6-astra"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true
# 未指定角色时，以中间执行层为子代理默认值。
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

# 固定角色模型见 .codex/agents/{architect,executor,mechanical}.toml。
# 顶层：GPT-6 Astra Medium；执行层：GPT-6.1 Sol Medium；机械层：GPT-6 Sol Medium。
